name: Build signed branch APK
run-name: UNSTABLE branch build ${{ inputs.source_branch }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Fork branch to build, for example feat/npatch-compat'
        required: true
        type: string
        default: main

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: LiJiaHua1024/Bilibili_Innocent_Lab

concurrency:
  group: branch-build-${{ inputs.source_branch }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'LiJiaHua1024/Bilibili_Innocent_Builds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No release environment or long-lived signing secrets in the source runner.
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CI_GRADLE_JVMARGS: '-Xmx6144m -Dfile.encoding=UTF-8'
      JDK_JAVA_OPTIONS: '-XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseCodeCacheFlushing'
    steps:
      - name: Declare extreme experimental instability
        run: |
          echo '::warning title=EXTREMELY UNSTABLE::More unstable than Canary. For early experiments or targeted Hotfix verification only; no stability or compatibility guarantee.'
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTICE'
          > [!CAUTION]
          > **极度不稳定的实验构建——比 Canary 更不稳定。**
          > 仅供抢先尝鲜或验证特定 Hotfix，不建议日常使用。通过 CI 不代表完成实机回归、宿主适配或修复确认。
          NOTICE

      - name: Validate source branch name
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: git check-ref-format "refs/heads/$SOURCE_BRANCH"

      - name: Check out selected branch
        uses: actions/checkout@v7.0.1
        with:
          # The source branch need not contain this workflow or be merged into main.
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: refs/heads/${{ inputs.source_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact source
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          branch_slug="$(printf '%s' "$SOURCE_BRANCH" | LC_ALL=C tr -c 'A-Za-z0-9._-' '_' | cut -c1-80)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=UNSTABLE-EXPERIMENTAL-${branch_slug}-${source_sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Branch builds must not save unverified state into the release cache.
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865' 'cmake;3.31.5'

      - name: Generate disposable build identity
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          export TEMP_SIGNING_PASSWORD="$password"
          echo "TEMP_SIGNING_PASSWORD=$password" >> "$GITHUB_ENV"
          keytool -genkeypair -alias branch-build -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=Disposable branch build' -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/branch-build.p12" \
            -storepass:env TEMP_SIGNING_PASSWORD -keypass:env TEMP_SIGNING_PASSWORD -noprompt

      - name: Build Release, run unit tests and full Lint
        working-directory: Bilibili_Innocent_Lab
        env:
          INNOCENT_LAB_SIGNING_STORE_FILE: ${{ runner.temp }}/branch-build.p12
          INNOCENT_LAB_SIGNING_KEY_ALIAS: branch-build
        run: |
          set -euo pipefail
          export INNOCENT_LAB_SIGNING_STORE_PASSWORD="$TEMP_SIGNING_PASSWORD"
          export INNOCENT_LAB_SIGNING_KEY_PASSWORD="$TEMP_SIGNING_PASSWORD"
          ./gradlew "-Dorg.gradle.jvmargs=${CI_GRADLE_JVMARGS}" \
            :app:assembleRelease :app:testDebugUnitTest :app:lintDebug \
            --continue --console=plain --no-daemon

      - name: Upload intermediate APK for isolated signing
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: intermediate-${{ steps.source.outputs.artifact_name }}
          path: Bilibili_Innocent_Lab/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload verification reports and R8 symbols
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports-${{ steps.source.outputs.artifact_name }}
          path: |
            Bilibili_Innocent_Lab/app/build/reports/
            Bilibili_Innocent_Lab/app/build/test-results/
            Bilibili_Innocent_Lab/app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/branch-build.p12"

  sign:
    name: Sign APK in isolated runner
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: alpha-release
    # Never check out or execute source-branch code on this runner.
    steps:
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install signing tools
        run: sdkmanager 'build-tools;37.0.0'

      - name: Download exact intermediate artifact
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: intermediate
          merge-multiple: true
          digest-mismatch: error

      - name: Apply fixed signing identity and verify APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_BASE64:?Missing ANDROID_SIGNING_KEY_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Missing ANDROID_SIGNING_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing ANDROID_SIGNING_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing ANDROID_SIGNING_KEY_PASSWORD}"
          : "${EXPECTED_CERT_SHA256:?Missing ANDROID_SIGNING_CERT_SHA256}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          keystore="$RUNNER_TEMP/branch-release.p12"
          trap 'rm -f "$RUNNER_TEMP/branch-release.p12"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          mkdir -p branch-artifact
          tools="$ANDROID_HOME/build-tools/37.0.0"
          # apksigner strips the disposable signatures before signing with the fixed key.
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out branch-artifact/app-release.apk intermediate/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs branch-artifact/app-release.apk > branch-artifact/signature.txt
          # Build Tools 37 prefixes these lines with V2/V3.0 instead of Signer #1.
          actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' branch-artifact/signature.txt | tr -d ': \r' | tr 'A-F' 'a-f' | sort -u)"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          grep -Eq '^Number of signers: 1$' branch-artifact/signature.txt
          "$tools/aapt" dump badging branch-artifact/app-release.apk > branch-artifact/apk-info.txt
          if grep -q '^application-debuggable' branch-artifact/apk-info.txt; then
            echo 'Refusing to publish a debuggable APK.' >&2
            exit 1
          fi
          {
            printf 'source_repository=%s\n' "$SOURCE_REPOSITORY"
            printf 'branch=%s\n' "$SOURCE_BRANCH"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'certificate_sha256=%s\n' "$actual"
            printf 'run_url=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > branch-artifact/build-info.txt
          cat > branch-artifact/READ-ME-FIRST-EXTREMELY-UNSTABLE.txt <<'NOTICE'
          极度不稳定的实验构建——比 Canary 更不稳定

          仅供抢先尝鲜，或针对特定 Hotfix 验证问题是否修复。不建议作为日常版本。
          可能存在崩溃、无法启动、Hook 失效、功能不完整以及宿主、设备、系统或注入框架不适配。
          通过构建、单测和完整 Lint，不代表完成实机回归，也不代表目标问题已修复。
          各分支不是功能合集；同包名、同签名的包会互相覆盖，版本码降低时可能无法直接覆盖安装。
          本证书与上游发布证书不同，将来切回上游正式版也不保证能够直接覆盖安装。
          反馈请附分支名、source_sha、构建链接、宿主版本、系统/设备/注入框架与复现步骤。
          NOTICE
          (cd branch-artifact && sha256sum app-release.apk > SHA256SUMS)
          cat branch-artifact/READ-ME-FIRST-EXTREMELY-UNSTABLE.txt branch-artifact/build-info.txt branch-artifact/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified signed branch APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: branch-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/branch-release.p12"
